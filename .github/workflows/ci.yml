name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Crear carpeta docs temporal (Workaround)
      run: |
        mkdir -p app/docs
        echo "dummy content" > app/docs/dummy.pdf

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-mock

    - name: Validar Build de Docker
      run: docker compose build

    - name: Ejecutar Tests Unitarios
      env:
        PYTHONPATH: .
      run: |
        # Pytest buscará automáticamente cualquier archivo que empiece con "test_"
        python -m pytest -vs