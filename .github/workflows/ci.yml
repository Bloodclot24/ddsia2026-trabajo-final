name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Ejecuta un escaneo profundo todos los lunes a las 2 AM

jobs:
  static-security-checks:
    name: 🛡️ Análisis Estático de Seguridad
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necesario para que Gitleaks revise todo el historial

    - name: 🕵️ Escaneo de Secretos (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🔍 Escaneo SAST para Python (Bandit)
      run: |
        pip install bandit
        # Escanea la carpeta app/ buscando fallos de seguridad en el código
        bandit -r app/ -ll -ii 

    - name: 🐳 Linting del Dockerfile (Hadolint)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile

  build-test-and-scan:
    name: 🧪 Build, Tests y Análisis de Contenedor
    needs: static-security-checks # Solo se ejecuta si el análisis estático es exitoso
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Crear carpeta docs temporal
      run: |
        mkdir -p app/docs
        echo "dummy content" > app/docs/dummy.pdf

    - name: Instalar dependencias para testing
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-mock

    - name: 🚦 Ejecutar Tests Unitarios
      env:
        PYTHONPATH: .
      run: python -m pytest -v -W ignore

    - name: 📦 Construir imagen Docker para escaneo
      run: docker build -t ddsia-api-local:latest .

    - name: ☢️ Escaneo de Vulnerabilidades del Contenedor (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ddsia-api-local:latest'
        format: 'table'
        exit-code: '1' # Hace que el pipeline falle si encuentra algo
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH' # Solo reportar vulnerabilidades Altas o Críticas