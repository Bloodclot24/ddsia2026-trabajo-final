name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Crear carpeta docs (Workaround para Git)
      run: |
        mkdir -p app/docs
        # Creamos un archivo de texto plano con extensión pdf para evitar que el loader falle
        echo "dummy content" > app/docs/dummy.pdf

    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        pip install pytest httpx pytest-mock

    - name: Validar Build de Docker
      run: docker-compose build

    - name: Ejecutar Tests Unitarios
      run: pytest test_main.py -v