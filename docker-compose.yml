version: '3.8'
services:
  api:
    build: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Docker Compose tomará el valor automáticamente del archivo .env
      - API_KEY=${API_KEY} 

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: